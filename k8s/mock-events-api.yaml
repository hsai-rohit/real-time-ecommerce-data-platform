apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-events-api
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-events-api
  template:
    metadata:
      labels:
        app: mock-events-api
    spec:
      containers:
        - name: mock-events-api
          image: ghcr.io/hsai-rohit/ecommerce-ingestion:latest
          imagePullPolicy: Always
          command:
            - python
            - scripts/mock_events_api.py
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: source-data
              mountPath: /app/data/source
              readOnly: true
      volumes:
        - name: source-data
          hostPath:
            path: /data/source
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: mock-events-api
  namespace: ecommerce
spec:
  selector:
    app: mock-events-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
